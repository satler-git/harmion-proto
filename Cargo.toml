[package]
name = "harmion-proto"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.1"
base64 = "0.22.1"
clap = { version = "4.5.34", features = ["derive"] }
color-eyre = "0.6.3"
loro = "1.4.6"
notify = "8.0.0"
reqwest = { version = "0.12.15", features = ["json", "http2", "charset", "rustls-tls"], default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["full"] }
